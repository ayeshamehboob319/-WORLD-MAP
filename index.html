<!DOCTYPE html>
<html>
<head>
    <title>World Map</title>

    <style>
        body {
            margin: 0;
            background-color: #b5dce8;
            text-align: center;
            font-family: "Times New Roman", serif;
        }

        h1 {
            font-size: 26px;
            margin: 15px 0 8px;
        }

        p {
            font-size: 17px;
            margin-bottom: 15px;
        }

        table {
            width: 75%;
            margin: auto;
        }

        .map {
            position: relative;
        }

        .map img {
            width: 100%;
            display: block;
        }

        .area {
            position: absolute;
            display: block;
            cursor: pointer;
            border-radius: 50%;
        }

        .area:hover {
            background-color: rgba(255, 255, 0, 0.25);
            outline: 3px solid red;
        }

        .asia {
            left: 51%;
            top: 3%;
            width: 37%;
            height: 38%;
        }

        .north-africa {
            left: 43%;
            top: 25%;
            width: 20%;
            height: 21%;
        }

        .south-america {
            left: 25%;
            top: 36%;
            width: 15%;
            height: 54%;
        }
    </style>
</head>

<body>

<h1>WORLD MAP</h1>

<p>Click on a region to explore</p>

<table cellpadding="0" cellspacing="0">
    <tr>
        <td>

            <div class="map">

                <img src="images/world-map.jpg" alt="World Map">

                <a href="asia.html"
                   class="area asia"
                   title="Asia"></a>

                <a href="north-africa.html"
                   class="area north-africa"
                   title="North Africa"></a>

                <a href="south-america.html"
                   class="area south-america"
                   title="South America"></a>

            </div>

        </td>
    </tr>
</table>

</body>
</html>
